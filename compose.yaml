name: conecta-campus

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conectacampus}
      MYSQL_USER: ${MYSQL_USER:-conecta_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Manaus}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: conecta-campus:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-conectacampus}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America%2FManaus&characterEncoding=UTF-8
      DB_USER: ${MYSQL_USER:-conecta_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      GOOGLE_SHEETS_FINANCEIRO_URL: ${GOOGLE_SHEETS_FINANCEIRO_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-STARTTLS}
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - app_uploads:/data/uploads
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
  app_uploads:
